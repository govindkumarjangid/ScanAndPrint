name: Build & Release Scan&Print Agent

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'scanandprint-agent/**'
      - '.github/workflows/release-agent.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Agent Dependencies
        working-directory: scanandprint-agent
        run: npm install

      - name: Build & Publish Release to GitHub
        working-directory: scanandprint-agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
