<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan&Print — Counter Order</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700;800&display=swap');

    :root {
      --bg-main: #09090b;
      --bg-card: #121113;
      --bg-card-hover: #18171a;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #F0245C;
      --brand: #F0245C;
      --brand-gradient: linear-gradient(135deg, #F0245C 0%, #e11d48 100%);
      --emerald: #10B981;
      --emerald-gradient: linear-gradient(135deg, #10B981 0%, #059669 100%);
      --emerald-glow: rgba(16, 185, 129, 0.35);
      --rose: #F43F5E;
      --rose-gradient: linear-gradient(135deg, #F43F5E 0%, #e11d48 100%);
      --rose-glow: rgba(244, 63, 94, 0.35);
      --text-primary: #FAFAFA;
      --text-secondary: #A1A1AA;
      --text-muted: #71717A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
      overflow: hidden;
      -webkit-app-region: drag;
      border: 1px solid var(--border-subtle);
    }

    .header-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .header-icon-title {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .icon-badge {
      width: 24px;
      height: 24px;
      background: rgba(240, 36, 92, 0.15);
      color: var(--brand);
      border: 1px solid rgba(240, 36, 92, 0.3);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .title {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }

    .time-badge {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }

    .info-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin: 4px 0;
      -webkit-app-region: no-drag;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .info-row {
      display: flex;
      font-size: 11.5px;
      line-height: 1.35;
      align-items: center;
      justify-content: space-between;
    }

    .info-label {
      font-weight: 700;
      color: var(--text-secondary);
      flex-shrink: 0;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .info-value {
      color: var(--text-primary);
      font-weight: 600;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 210px;
    }

    .amount-highlight {
      color: var(--emerald);
      font-weight: 800;
      font-size: 13px;
    }

    .amount-note {
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 500;
      margin-left: 3px;
    }

    .actions-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 8px;
    }

    button {
      border: none;
      outline: none;
      padding: 8px 10px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-approve {
      background: var(--emerald-gradient);
      box-shadow: 0 3px 10px var(--emerald-glow);
    }

    .btn-approve:hover {
      filter: brightness(1.12);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.5);
    }

    .btn-deny {
      background: var(--rose-gradient);
      box-shadow: 0 3px 10px var(--rose-glow);
    }

    .btn-deny:hover {
      filter: brightness(1.12);
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.5);
    }

    .footer-note {
      text-align: center;
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header-container">
    <div class="header-icon-title">
      <div class="icon-badge"><i class='bx bx-printer'></i></div>
      <h1 class="title">Counter Cash Order</h1>
    </div>
    <span class="time-badge" id="val-time">--:--</span>
  </div>

  <!-- Order Details Box -->
  <div class="info-card">
    <div class="info-row">
      <span class="info-label">Print</span>
      <span class="info-value" id="val-print">⚫ B&W • 1 page • 1 copy</span>
    </div>
    <div class="info-row">
      <span class="info-label">Collect</span>
      <span class="info-value" id="val-amount">
        <span class="amount-highlight">₹5</span>
        <span class="amount-note">(Cash at counter)</span>
      </span>
    </div>
    <div class="info-row">
      <span class="info-label">File</span>
      <span class="info-value" id="val-file" style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #e4e4e7;">document.pdf</span>
    </div>
  </div>

  <!-- Buttons -->
  <div class="actions-container">
    <div class="button-group">
      <button class="btn-approve" id="btn-approve" type="button">
        <i class='bx bx-check-circle'></i>
        <span>Approve & Print</span>
      </button>
      <button class="btn-deny" id="btn-deny" type="button">
        <i class='bx bx-x-circle'></i>
        <span>Reject</span>
      </button>
    </div>
    <p class="footer-note">Reject karne par order cancel ho jayega</p>
  </div>

  <script>
    let currentJobId = null

    // Play notification alert chime
    function playAlertChime() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)()
        const osc = audioCtx.createOscillator()
        const gain = audioCtx.createGain()
        osc.type = 'sine'
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime) // D5
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.12) // A5
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime)
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5)
        osc.connect(gain)
        gain.connect(audioCtx.destination)
        osc.start()
        osc.stop(audioCtx.currentTime + 0.5)
      } catch (e) {}
    }

    // Format current time (e.g. 10:27 PM)
    function formatTime(dateObj = new Date()) {
      return dateObj.toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      })
    }

    function renderJobData(jobData) {
      if (!jobData) return
      currentJobId = jobData?.jobId
      playAlertChime()

      const isColor = jobData?.colorType === 'COLOR'
      const printTypeIcon = isColor ? '🌈 Color' : '⚫ B&W'
      const pages = Number(jobData?.totalPages) || 1
      const copies = Number(jobData?.copies) || 1
      const amount = Number(jobData?.totalAmount) || 0
      const fileName = jobData?.originalFileName || 'document.pdf'
      const timeStr = formatTime(jobData?.createdAt ? new Date(jobData.createdAt) : new Date())

      document.getElementById('val-print').textContent = `${printTypeIcon} • ${pages} page (pages: ${pages}) • ${copies} copy`
      document.getElementById('val-amount').innerHTML = `<span class="amount-highlight">₹${amount}</span><span class="amount-note">(counter par lena hai)</span>`
      document.getElementById('val-file').textContent = fileName
      document.getElementById('val-time').textContent = timeStr
    }

    window.electronAPI?.onCounterOrder((jobData) => {
      renderJobData(jobData)
    })

    // Pull immediately on load as well
    if (window.electronAPI?.getCounterOrder) {
      window.electronAPI.getCounterOrder().then((jobData) => {
        if (jobData) renderJobData(jobData)
      })
    }

    document.getElementById('btn-approve').addEventListener('click', () => {
      document.getElementById('btn-approve').disabled = true
      document.getElementById('btn-approve').innerHTML = "<i class='bx bx-loader-alt bx-spin'></i> Printing..."
      window.electronAPI?.approveCounterOrder(currentJobId)
    })

    document.getElementById('btn-deny').addEventListener('click', () => {
      document.getElementById('btn-deny').disabled = true
      document.getElementById('btn-deny').innerHTML = "<i class='bx bx-loader-alt bx-spin'></i> Cancelling..."
      window.electronAPI?.denyCounterOrder(currentJobId)
    })

    playAlertChime()
  </script>
</body>
</html>
