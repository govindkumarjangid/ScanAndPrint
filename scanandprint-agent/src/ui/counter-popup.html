<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan&Print — Counter Order</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700;800&display=swap');

    :root {
      --bg-main: #09090b;
      --bg-card: #121113;
      --bg-card-hover: #18171a;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #F0245C;
      --brand: #F0245C;
      --brand-gradient: linear-gradient(135deg, #F0245C 0%, #e11d48 100%);
      --emerald: #10B981;
      --emerald-gradient: linear-gradient(135deg, #10B981 0%, #059669 100%);
      --emerald-glow: rgba(16, 185, 129, 0.35);
      --emerald-bg: rgba(16, 185, 129, 0.12);
      --emerald-border: rgba(16, 185, 129, 0.35);
      --rose: #F43F5E;
      --rose-gradient: linear-gradient(135deg, #F43F5E 0%, #e11d48 100%);
      --rose-glow: rgba(244, 63, 94, 0.35);
      --amber: #F59E0B;
      --amber-bg: rgba(245, 158, 11, 0.12);
      --amber-border: rgba(245, 158, 11, 0.35);
      --sky: #38bdf8;
      --sky-bg: rgba(56, 189, 248, 0.12);
      --sky-border: rgba(56, 189, 248, 0.35);
      --text-primary: #FAFAFA;
      --text-secondary: #A1A1AA;
      --text-muted: #71717A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
      overflow: hidden;
      -webkit-app-region: drag;
      border: 1px solid var(--border-subtle);
    }

    .header-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .header-icon-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-badge {
      width: 28px;
      height: 28px;
      background: rgba(240, 36, 92, 0.15);
      color: var(--brand);
      border: 1px solid rgba(240, 36, 92, 0.3);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .title {
      font-size: 14.5px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }

    .time-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 3px 7px;
      border-radius: 5px;
      border: 1px solid var(--border-subtle);
    }

    .info-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin: 8px 0;
      -webkit-app-region: no-drag;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .file-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .file-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: #e4e4e7;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 230px;
    }

    .spec-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .spec-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: 9px;
      padding: 7px 9px;
    }

    .spec-chip i {
      font-size: 15px;
      flex-shrink: 0;
    }

    .spec-chip-text {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
      min-width: 0;
    }

    .spec-chip-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--text-muted);
    }

    .spec-chip-val {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .spec-chip.chip-color i { color: var(--sky); }
    .spec-chip.chip-color.is-bw i { color: var(--text-secondary); }
    .spec-chip.chip-duplex i { color: var(--emerald); }
    .spec-chip.chip-duplex.is-single i { color: var(--text-secondary); }
    .spec-chip.chip-pages i { color: var(--amber); }
    .spec-chip.chip-copies i { color: var(--brand); }

    .amount-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 9px;
      border-top: 1px solid var(--border-subtle);
    }

    .amount-label {
      font-weight: 700;
      color: var(--text-secondary);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .amount-highlight {
      color: var(--emerald);
      font-weight: 800;
      font-size: 17px;
    }

    .amount-note {
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 500;
      margin-left: 4px;
    }

    .actions-container {
      display: flex;
      flex-direction: column;
      gap: 5px;
      -webkit-app-region: no-drag;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 8px;
    }

    button {
      border: none;
      outline: none;
      padding: 10px 10px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-approve {
      background: var(--emerald-gradient);
      box-shadow: 0 3px 10px var(--emerald-glow);
    }

    .btn-approve:hover {
      filter: brightness(1.12);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.5);
    }

    .btn-deny {
      background: var(--rose-gradient);
      box-shadow: 0 3px 10px var(--rose-glow);
    }

    .btn-deny:hover {
      filter: brightness(1.12);
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.5);
    }

    .footer-note {
      text-align: center;
      font-size: 10.5px;
      color: var(--text-muted);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header-container">
    <div class="header-icon-title">
      <div class="icon-badge"><i class='bx bx-printer'></i></div>
      <h1 class="title">Counter Cash Order</h1>
    </div>
    <span class="time-badge" id="val-time">--:--</span>
  </div>

  <!-- Order Details Box -->
  <div class="info-card">
    <div class="file-row">
      <div class="file-icon"><i class='bx bxs-file-pdf' id="file-icon-el"></i></div>
      <div class="file-name" id="val-file">document.pdf</div>
    </div>

    <div class="spec-grid">
      <div class="spec-chip chip-pages">
        <i class='bx bx-copy-alt'></i>
        <div class="spec-chip-text">
          <span class="spec-chip-label">Pages</span>
          <span class="spec-chip-val" id="val-pages">1</span>
        </div>
      </div>
      <div class="spec-chip chip-copies">
        <i class='bx bx-layer'></i>
        <div class="spec-chip-text">
          <span class="spec-chip-label">Copies</span>
          <span class="spec-chip-val" id="val-copies">1</span>
        </div>
      </div>
      <div class="spec-chip chip-color" id="chip-color">
        <i class='bx bx-palette' id="icon-color"></i>
        <div class="spec-chip-text">
          <span class="spec-chip-label">Color Mode</span>
          <span class="spec-chip-val" id="val-color">B&W</span>
        </div>
      </div>
      <div class="spec-chip chip-duplex" id="chip-duplex">
        <i class='bx bx-duplicate' id="icon-duplex"></i>
        <div class="spec-chip-text">
          <span class="spec-chip-label">Sides</span>
          <span class="spec-chip-val" id="val-duplex">Single-sided</span>
        </div>
      </div>
    </div>

    <div class="amount-row">
      <span class="amount-label">Collect at Counter</span>
      <span>
        <span class="amount-highlight" id="val-amount-num">₹0</span>
        <span class="amount-note">Cash</span>
      </span>
    </div>
  </div>

  <!-- Buttons -->
  <div class="actions-container">
    <div class="button-group">
      <button class="btn-approve" id="btn-approve" type="button">
        <i class='bx bx-check-circle'></i>
        <span>Approve & Print</span>
      </button>
      <button class="btn-deny" id="btn-deny" type="button">
        <i class='bx bx-x-circle'></i>
        <span>Reject</span>
      </button>
    </div>
    <p class="footer-note">Reject karne par order cancel ho jayega</p>
  </div>

  <script>
    let currentJobId = null

    // Play notification alert chime
    function playAlertChime() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)()
        const osc = audioCtx.createOscillator()
        const gain = audioCtx.createGain()
        osc.type = 'sine'
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime) // D5
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.12) // A5
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime)
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5)
        osc.connect(gain)
        gain.connect(audioCtx.destination)
        osc.start()
        osc.stop(audioCtx.currentTime + 0.5)
      } catch (e) {}
    }

    // Format current time (e.g. 10:27 PM)
    function formatTime(dateObj = new Date()) {
      return dateObj.toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      })
    }

    // Same duplex-detection logic as printService.js's resolveDuplexSide(),
    // kept in sync so the popup always shows exactly what will actually print.
    function isDuplexRequested(jobData) {
      const explicitSide = String(jobData?.side || jobData?.duplexMode || jobData?.printSide || '').toLowerCase().trim()
      if (explicitSide.startsWith('duplex')) return true
      return (
        jobData?.duplex === true ||
        jobData?.isDuplex === true ||
        jobData?.doubleSided === true ||
        jobData?.printSides === 'DOUBLE' ||
        jobData?.printSides === 'double' ||
        jobData?.sides === 'double'
      )
    }

    function fileIconFor(fileName) {
      const ext = (fileName || '').split('.').pop().toLowerCase()
      if (['png', 'jpg', 'jpeg', 'webp'].includes(ext)) return 'bx-image'
      if (ext === 'doc' || ext === 'docx') return 'bxs-file-doc'
      return 'bxs-file-pdf'
    }

    function renderJobData(jobData) {
      if (!jobData) return
      currentJobId = jobData?.jobId
      playAlertChime()

      const isColor = jobData?.colorType === 'COLOR'
      const isDuplex = isDuplexRequested(jobData)
      const pages = Number(jobData?.totalPages) || 1
      const copies = Number(jobData?.copies) || 1
      const amount = Number(jobData?.totalAmount) || 0
      const fileName = jobData?.originalFileName || 'document.pdf'
      const timeStr = formatTime(jobData?.createdAt ? new Date(jobData.createdAt) : new Date())

      document.getElementById('val-file').textContent = fileName
      document.getElementById('file-icon-el').className = 'bx ' + fileIconFor(fileName)
      document.getElementById('val-time').textContent = timeStr
      document.getElementById('val-pages').textContent = `${pages} page${pages > 1 ? 's' : ''}`
      document.getElementById('val-copies').textContent = copies > 1 ? `${copies} copies` : '1 copy'

      const colorChip = document.getElementById('chip-color')
      const colorIcon = document.getElementById('icon-color')
      document.getElementById('val-color').textContent = isColor ? 'Full Color' : 'Black & White'
      colorChip.classList.toggle('is-bw', !isColor)
      colorIcon.className = 'bx ' + (isColor ? 'bx-palette' : 'bx-brightness')

      const duplexChip = document.getElementById('chip-duplex')
      const duplexIcon = document.getElementById('icon-duplex')
      document.getElementById('val-duplex').textContent = isDuplex ? 'Double-sided' : 'Single-sided'
      duplexChip.classList.toggle('is-single', !isDuplex)
      duplexIcon.className = 'bx ' + (isDuplex ? 'bx-duplicate' : 'bx-file-blank')

      document.getElementById('val-amount-num').textContent = `₹${amount}`
    }

    window.electronAPI?.onCounterOrder((jobData) => {
      renderJobData(jobData)
    })

    // Pull immediately on load as well
    if (window.electronAPI?.getCounterOrder) {
      window.electronAPI.getCounterOrder().then((jobData) => {
        if (jobData) renderJobData(jobData)
      })
    }

    document.getElementById('btn-approve').addEventListener('click', () => {
      document.getElementById('btn-approve').disabled = true
      document.getElementById('btn-approve').innerHTML = "<i class='bx bx-loader-alt bx-spin'></i> Printing..."
      window.electronAPI?.approveCounterOrder(currentJobId)
    })

    document.getElementById('btn-deny').addEventListener('click', () => {
      document.getElementById('btn-deny').disabled = true
      document.getElementById('btn-deny').innerHTML = "<i class='bx bx-loader-alt bx-spin'></i> Cancelling..."
      window.electronAPI?.denyCounterOrder(currentJobId)
    })

    playAlertChime()
  </script>
</body>
</html>
